<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Mencegah zoom otomatis pada input form di iOS/Android -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Pernikahan</title>

    <style>
        /* ==========================================================================
           1. RESET & BASE STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }

        body {
            /* Fallback background image dasar */
            background: url('body.webp') center center / cover no-repeat fixed #111;
            overflow-x: hidden;
            width: 100%;
        }

        /* ==========================================================================
           2. SECTION & VIDEO BACKGROUND STYLES
           ========================================================================== */
        .section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container background video agar presisi mengikuti rasio MP4 */
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            /* Mencegah interaksi pointer menembus video */
            pointer-events: none;
        }

        /* Container untuk elemen interaktif di atas video */
        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px; /* Lebar maksimal tampilan mobile */
            padding: 24px;
            margin: 0 auto;
            text-align: center;
            /* Memastikan tombol/form mudah diklik */
            pointer-events: auto;
        }

        /* ==========================================================================
           3. UI BUTTONS & INPUTS
           ========================================================================== */
        .btn-primary {
            display: inline-block;
            background-color: #ffffff;
            color: #111111;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
            font-size: 14px;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        /* Card container transparan untuk readability teks interaktif */
        .interactive-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 15px;
        }

        /* ==========================================================================
           4. SECTION SPECIFIC STYLES
           ========================================================================== */
        /* Section 1: Cover */
        .guest-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .guest-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            word-break: break-word;
        }

        /* Section 4: Countdown */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 8px;
            min-width: 60px;
        }

        .countdown-value {
            font-size: 1.4rem;
            font-weight: bold;
            display: block;
        }

        .countdown-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Section 6: RSVP Form */
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            font-size: 0.9rem;
            outline: none;
        }

        .form-control:focus {
            border-color: #ffffff;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        #rsvpFeedback {
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Section 7: Gift / Bank Account */
        .account-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
        }

        .account-number {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 5px 0;
        }

        /* ==========================================================================
           5. FIXED NAVIGATION & MUSIC CONTROL
           ========================================================================== */
        /* Audio Toggle Button */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .music-control svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* Bottom Fixed Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 998;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .nav-item.active, .nav-item:hover {
            opacity: 1;
        }

        .nav-item img {
            width: 22px;
            height: 22px;
            filter: invert(1); /* Mengubah icon SVG hitam menjadi putih jika perlu */
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
         AUDIO PLAYER (BACKGROUND MUSIC)
         ========================================================================== -->
    <audio id="backgroundMusic" loop preload="auto">
        <source src="music/background.mp3" type="audio/mpeg">
    </audio>

    <!-- Tombol Play/Pause Musik -->
    <button class="music-control" id="musicToggle" aria-label="Toggle Music">
        <svg id="iconPlay" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <!-- ==========================================================================
         SECTION 1: COVER
         ========================================================================== -->
    <section id="cover" class="section">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="video/1.mp4" type="video/mp4">
        </video>
        <div class="content-overlay" style="margin-top: auto; margin-bottom: 60px;">
            <div class="guest-title">Kepada Yth. Bapak/Ibu/Saudara/i:</div>
            <div class="guest-name" id="guestNameDisplay">Tamu Undangan</div>
            <button class="btn-primary" onclick="bukaUndangan()">Buka Undangan</button>
        </div>
    </section>

    <!-- ==========================================================================
         SECTION 2: OPENING
         ========================================================================== -->
    <section id="opening" class="section">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="video/2.mp4" type="video/mp4">
        </video>
        <div class="content-overlay">
            <!-- Konten mengikuti visual 2.mp4 -->
        </div>
    </section>

    <!-- ==========================================================================
         SECTION 3: NAMA PENGANTIN
         ========================================================================== -->
    <section id="mempelai" class="section">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="video/3.mp4" type="video/mp4">
        </video>
        <div class="content-overlay">
            <!-- Konten mengikuti visual 3.mp4 -->
        </div>
    </section>

    <!-- ==========================================================================
         SECTION 4: INFORMASI ACARA + COUNTDOWN
         ========================================================================== -->
    <section id="acara" class="section">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="video/4.mp4" type="video/mp4">
        </video>
        <div class="content-overlay">
            <!-- Overlay Countdown Interaktif -->
            <div class="interactive-card" style="margin-top: auto;">
                <div id="countdownMessage" style="font-size: 0.9rem; font-weight: bold;">Hitung Mundur Acara</div>
                <div class="countdown-container" id="countdownTimer">
                    <div class="countdown-box"><span class="countdown-value" id="days">00</span><span class="countdown-label">Hari</span></div>
                    <div class="countdown-box"><span class="countdown-value" id="hours">00</span><span class="countdown-label">Jam</span></div>
                    <div class="countdown-box"><span class="countdown-value" id="minutes">00</span><span class="countdown-label">Menit</span></div>
                    <div class="countdown-box"><span class="countdown-value" id="seconds">00</span><span class="countdown-label">Detik</span></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ==========================================================================
         SECTION 5: LOKASI ACARA
         ========================================================================== -->
    <section id="lokasi" class="section">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="video/5.mp4" type="video/mp4">
        </video>
        <div class="content-overlay">
            <div style="margin-top: auto; margin-bottom: 20px;">
                <button class="btn-primary" onclick="openGoogleMaps()">Lihat Lokasi Google Maps</button>
            </div>
        </div>
    </section>

    <!-- ==========================================================================
         SECTION 6: RSVP
         ========================================================================== -->
    <section id="rsvp" class="section">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="video/6.mp4" type="video/mp4">
        </video>
        <div class="content-overlay">
            <div class="interactive-card">
                <form id="rsvpForm" onsubmit="submitRSVP(event)">
                    <div class="form-group">
                        <label for="rsvpName">Nama Lengkap</label>
                        <input type="text" id="rsvpName" class="form-control" required placeholder="Masukkan Nama">
                    </div>
                    <div class="form-group">
                        <label for="rsvpAttendance">Konfirmasi Kehadiran</label>
                        <select id="rsvpAttendance" class="form-control" required>
                            <option value="Hadir">Hadir</option>
                            <option value="Tidak Hadir">Tidak Hadir</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rsvpGuests">Jumlah Tamu</label>
                        <input type="number" id="rsvpGuests" class="form-control" min="1" max="5" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="rsvpMessage">Pesan / Ucapan</label>
                        <textarea id="rsvpMessage" class="form-control" rows="3" placeholder="Berikan ucapan selamat..."></textarea>
                    </div>
                    <button type="submit" id="btnSubmitRsvp" class="btn-primary" style="width: 100%; margin-top: 5px;">Kirim RSVP</button>
                    <div id="rsvpFeedback"></div>
                </form>
            </div>
        </div>
    </section>

    <!-- ==========================================================================
         SECTION 7: GIFT / AMPLOP DIGITAL
         ========================================================================== -->
    <section id="gift" class="section">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="video/7.mp4" type="video/mp4">
        </video>
        <div class="content-overlay">
            <div class="interactive-card">
                <!-- Rekening 1 -->
                <div class="account-card">
                    <div style="font-size: 0.85rem; font-weight: bold;">BANK BCA</div>
                    <div class="account-number">1234567890</div>
                    <div style="font-size: 0.8rem; margin-bottom: 8px;">a.n. Nama Pemilik</div>
                    <button class="btn-primary" style="padding: 6px 16px; font-size: 0.8rem;" onclick="copyToClipboard('1234567890', this)">Copy Rekening</button>
                </div>

                <!-- Rekening 2 (Opsional / Tambahan) -->
                <div class="account-card">
                    <div style="font-size: 0.85rem; font-weight: bold;">BANK MANDIRI</div>
                    <div class="account-number">0987654321</div>
                    <div style="font-size: 0.8rem; margin-bottom: 8px;">a.n. Nama Pemilik</div>
                    <button class="btn-primary" style="padding: 6px 16px; font-size: 0.8rem;" onclick="copyToClipboard('0987654321', this)">Copy Rekening</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ==========================================================================
         SECTION 8: CLOSING
         ========================================================================== -->
    <section id="closing" class="section">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="video/8.mp4" type="video/mp4">
        </video>
        <div class="content-overlay">
            <!-- Konten mengikuti visual 8.mp4 -->
        </div>
    </section>

    <!-- ==========================================================================
         FIXED NAVIGATION BAR
         ========================================================================== -->
    <nav class="bottom-nav">
        <a href="#cover" class="nav-item">
            <img src="icon/home.svg" alt="Home">
        </a>
        <a href="#acara" class="nav-item">
            <img src="icon/calendar.svg" alt="Acara">
        </a>
        <a href="#lokasi" class="nav-item">
            <img src="icon/location.svg" alt="Lokasi">
        </a>
        <a href="#rsvp" class="nav-item">
            <img src="icon/rsvp.svg" alt="RSVP">
        </a>
        <a href="#gift" class="nav-item">
            <img src="icon/gift.svg" alt="Gift">
        </a>
    </nav>

    <!-- ==========================================================================
         JAVASCRIPT LOGIC
         ========================================================================== -->
    <script>
        /* ----------------------------------------------------------------------
           1. KONFIGURASI UTAMA (Dapat Diubah)
           ---------------------------------------------------------------------- */
        // Tanggal Acara untuk Countdown
        const eventDate = new Date("2026-10-16T14:00:00").getTime();

        // URL Google Maps Lokasi Acara
        const mapsUrl = "https://maps.google.com";

        // URL Web App Google Apps Script untuk Form RSVP
        const GOOGLE_SCRIPT_URL = "GANTI_DENGAN_URL_GOOGLE_APPS_SCRIPT";


        /* ----------------------------------------------------------------------
           2. TANGKAP PARAMETER NAMA TAMU (?to=NamaTamu)
           ---------------------------------------------------------------------- */
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const guestName = urlParams.get('to');
            const displayElement = document.getElementById('guestNameDisplay');

            if (guestName && guestName.trim() !== "") {
                displayElement.textContent = decodeURIComponent(guestName);
            }
        });


        /* ----------------------------------------------------------------------
           3. KONTROL AUDIO (BACKGROUND MUSIC)
           ---------------------------------------------------------------------- */
        const audio = document.getElementById('backgroundMusic');
        const musicToggleBtn = document.getElementById('musicToggle');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    iconPlay.style.display = 'none';
                    iconPause.style.display = 'block';
                    isPlaying = true;
                }).catch(err => {
                    console.log("Autoplay diblokir oleh browser:", err);
                });
            }
        }

        musicToggleBtn.addEventListener('click', toggleAudio);

        // Fungsi Buka Undangan pada Section Cover
        function bukaUndangan() {
            // Coba putar musik secara otomatis setelah user mengklik tombol
            audio.play().then(() => {
                isPlaying = true;
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
            }).catch(() => {
                isPlaying = false;
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
            });

            // Smooth scroll menuju section Opening
            document.getElementById('opening').scrollIntoView({ behavior: 'smooth' });
        }


        /* ----------------------------------------------------------------------
           4. COUNTDOWN TIMER
           ---------------------------------------------------------------------- */
        const countdownInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = eventDate - now;

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("countdownMessage").textContent = "Acara telah selesai";
                document.getElementById("countdownTimer").style.display = "none";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = String(days).padStart(2, '0');
            document.getElementById("hours").textContent = String(hours).padStart(2, '0');
            document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
            document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
        }, 1000);


        /* ----------------------------------------------------------------------
           5. NAVIGASI LOKASI (GOOGLE MAPS)
           ---------------------------------------------------------------------- */
        function openGoogleMaps() {
            window.open(mapsUrl, '_blank');
        }


        /* ----------------------------------------------------------------------
           6. COPY NOMOR REKENING TO CLIPBOARD
           ---------------------------------------------------------------------- */
        function copyToClipboard(text, buttonElement) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopySuccess(buttonElement);
                }).catch(err => {
                    fallbackCopyTextToClipboard(text, buttonElement);
                });
            } else {
                fallbackCopyTextToClipboard(text, buttonElement);
            }
        }

        function fallbackCopyTextToClipboard(text, buttonElement) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showCopySuccess(buttonElement);
            } catch (err) {
                alert('Gagal menyalin nomor rekening');
            }
            document.body.removeChild(textArea);
        }

        function showCopySuccess(buttonElement) {
            const originalText = buttonElement.textContent;
            buttonElement.textContent = "Tersalin!";
            buttonElement.style.backgroundColor = "#28a745";
            buttonElement.style.color = "#ffffff";
            setTimeout(() => {
                buttonElement.textContent = originalText;
                buttonElement.style.backgroundColor = "#ffffff";
                buttonElement.style.color = "#111111";
            }, 2000);
        }


        /* ----------------------------------------------------------------------
           7. PENGIRIMAN FORM RSVP (INTEGRASI GOOGLE APPS SCRIPT)
           ---------------------------------------------------------------------- */
        function submitRSVP(event) {
            event.preventDefault();

            const feedback = document.getElementById('rsvpFeedback');
            const submitBtn = document.getElementById('btnSubmitRsvp');

            const payload = {
                nama: document.getElementById('rsvpName').value,
                kehadiran: document.getElementById('rsvpAttendance').value,
                jumlah: document.getElementById('rsvpGuests').value,
                pesan: document.getElementById('rsvpMessage').value
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Mengirim...";
            feedback.style.color = "#ffffff";
            feedback.textContent = "Sedang memproses...";

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Penting untuk mengirim cross-origin ke Google Apps Script
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                feedback.style.color = "#28a745";
                feedback.textContent = "RSVP berhasil dikirim.";
                document.getElementById('rsvpForm').reset();
                submitBtn.disabled = false;
                submitBtn.textContent = "Kirim RSVP";
            })
            .catch((error) => {
                console.error('Error:', error);
                feedback.style.color = "#dc3545";
                feedback.textContent = "Terjadi kesalahan. Silakan coba lagi.";
                submitBtn.disabled = false;
                submitBtn.textContent = "Kirim RSVP";
            });
        }
    </script>
</body>
</html>
